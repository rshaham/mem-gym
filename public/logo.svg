<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Gradient for main brain shape -->
    <linearGradient id="brainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <!-- Glow effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="#0F172A"/>

  <!-- Outer ring -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="url(#brainGradient)" stroke-width="4" opacity="0.3"/>

  <!-- Stylized brain/neural network -->
  <g filter="url(#glow)">
    <!-- Central hub -->
    <circle cx="256" cy="256" r="40" fill="url(#brainGradient)"/>

    <!-- Neural nodes - top -->
    <circle cx="256" cy="140" r="24" fill="#3B82F6"/>
    <circle cx="180" cy="180" r="20" fill="#8B5CF6"/>
    <circle cx="332" cy="180" r="20" fill="#8B5CF6"/>

    <!-- Neural nodes - sides -->
    <circle cx="140" cy="256" r="24" fill="#3B82F6"/>
    <circle cx="372" cy="256" r="24" fill="#3B82F6"/>

    <!-- Neural nodes - bottom -->
    <circle cx="180" cy="332" r="20" fill="#8B5CF6"/>
    <circle cx="332" cy="332" r="20" fill="#8B5CF6"/>
    <circle cx="256" cy="372" r="24" fill="#3B82F6"/>

    <!-- Connecting lines -->
    <g stroke="url(#brainGradient)" stroke-width="3" stroke-linecap="round" opacity="0.8">
      <!-- From center to all nodes -->
      <line x1="256" y1="216" x2="256" y2="164"/>
      <line x1="226" y1="236" x2="196" y2="196"/>
      <line x1="286" y1="236" x2="316" y2="196"/>
      <line x1="216" y1="256" x2="164" y2="256"/>
      <line x1="296" y1="256" x2="348" y2="256"/>
      <line x1="226" y1="276" x2="196" y2="316"/>
      <line x1="286" y1="276" x2="316" y2="316"/>
      <line x1="256" y1="296" x2="256" y2="348"/>

      <!-- Outer connections -->
      <line x1="256" y1="140" x2="180" y2="180" opacity="0.5"/>
      <line x1="256" y1="140" x2="332" y2="180" opacity="0.5"/>
      <line x1="180" y1="180" x2="140" y2="256" opacity="0.5"/>
      <line x1="332" y1="180" x2="372" y2="256" opacity="0.5"/>
      <line x1="140" y1="256" x2="180" y2="332" opacity="0.5"/>
      <line x1="372" y1="256" x2="332" y2="332" opacity="0.5"/>
      <line x1="180" y1="332" x2="256" y2="372" opacity="0.5"/>
      <line x1="332" y1="332" x2="256" y2="372" opacity="0.5"/>
    </g>
  </g>

  <!-- Pulse rings (animation hint) -->
  <circle cx="256" cy="256" r="100" fill="none" stroke="#3B82F6" stroke-width="2" opacity="0.2"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="#8B5CF6" stroke-width="1.5" opacity="0.15"/>
</svg>
