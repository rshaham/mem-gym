<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" rx="8" fill="#0F172A"/>

  <!-- Simplified neural network -->
  <g fill="url(#grad)">
    <!-- Center node -->
    <circle cx="16" cy="16" r="4"/>
    <!-- Corner nodes -->
    <circle cx="8" cy="8" r="2.5"/>
    <circle cx="24" cy="8" r="2.5"/>
    <circle cx="8" cy="24" r="2.5"/>
    <circle cx="24" cy="24" r="2.5"/>
  </g>

  <!-- Connections -->
  <g stroke="url(#grad)" stroke-width="1.5" stroke-linecap="round" opacity="0.7">
    <line x1="13" y1="13" x2="10" y2="10"/>
    <line x1="19" y1="13" x2="22" y2="10"/>
    <line x1="13" y1="19" x2="10" y2="22"/>
    <line x1="19" y1="19" x2="22" y2="22"/>
  </g>
</svg>
